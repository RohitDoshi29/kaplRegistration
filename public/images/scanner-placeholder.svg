      <rect x="325" y="195" width="20" height="14" rx="2" />

      <rect x="110" y="245" width="28" height="14" rx="2" />
      <rect x="150" y="245" width="14" height="28" rx="2" />
      <rect x="180" y="245" width="28" height="14" rx="2" />
      <rect x="220" y="245" width="14" height="14" rx="2" />
      <rect x="250" y="245" width="28" height="14" rx="2" />
      <rect x="290" y="245" width="14" height="28" rx="2" />
      <rect x="320" y="245" width="25" height="14" rx="2" />

      <rect x="115" y="280" width="14" height="28" rx="2" />
