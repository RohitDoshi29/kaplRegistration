  <!-- Bottom Details & Accepted UPI Logos -->
  <g transform="translate(40, 432)">
    <text x="210" y="16" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" fill="#FBBF24" text-anchor="middle" letter-spacing="1">
