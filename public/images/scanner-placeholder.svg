<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#111726" />
      <stop offset="100%" stop-color="#080B12" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#10B981" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="500" height="500" rx="28" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="3" />
  
  <g opacity="0.07" stroke="#FFFFFF" stroke-width="1">
    <line x1="50" y1="0" x2="50" y2="500" />
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="150" y1="0" x2="150" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="250" y1="0" x2="250" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="350" y1="0" x2="350" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="450" y1="0" x2="450" y2="500" />
    <line x1="0" y1="50" x2="500" y2="50" />
    <line x1="0" y1="100" x2="500" y2="100" />
    <line x1="0" y1="150" x2="500" y2="150" />
    <line x1="0" y1="200" x2="500" y2="200" />
    <line x1="0" y1="250" x2="500" y2="250" />
    <line x1="0" y1="300" x2="500" y2="300" />
    <line x1="0" y1="350" x2="500" y2="350" />
    <line x1="0" y1="400" x2="500" y2="400" />
    <line x1="0" y1="450" x2="500" y2="450" />
  </g>

  <g transform="translate(100, 24)">
    <rect width="300" height="34" rx="17" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="22" cy="17" r="5" fill="#10B981" />
    <text x="150" y="22" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="800" fill="#34D399" text-anchor="middle" letter-spacing="1.5">
      OFFICIAL TOURNAMENT SCANNER
    </text>
  </g>

  <g transform="translate(65, 75)">
    <rect width="370" height="340" rx="20" fill="#FFFFFF" filter="url(#glow)" />
    
    <!-- QR Corner 1 -->
    <rect x="25" y="25" width="70" height="70" rx="8" fill="#0A0E17" />
    <rect x="35" y="35" width="50" height="50" rx="4" fill="#FFFFFF" />
    <rect x="43" y="43" width="34" height="34" rx="3" fill="#D97706" />

