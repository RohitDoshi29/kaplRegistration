  <!-- Corner Glowing Accents -->
  <path d="M 50 25 L 25 25 L 25 50" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 450 25 L 475 25 L 475 50" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 25 450 L 25 475 L 50 475" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
  <path d="M 475 450 L 475 475 L 450 475" fill="none" stroke="#F59E0B" stroke-width="4" stroke-linecap="round" />
