      <rect x="170" y="70" width="28" height="14" rx="2" />
      <rect x="210" y="80" width="14" height="14" rx="2" />
      <rect x="240" y="75" width="28" height="14" rx="2" />

      <rect x="25" y="115" width="14" height="28" rx="2" />
      <rect x="50" y="110" width="28" height="14" rx="2" />
      <rect x="90" y="125" width="14" height="14" rx="2" />
