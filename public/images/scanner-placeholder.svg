      <rect x="280" y="145" width="28" height="14" rx="2" />
      <rect x="320" y="150" width="24" height="14" rx="2" />

      <rect x="25" y="190" width="14" height="14" rx="2" />
      <rect x="60" y="185" width="28" height="14" rx="2" />
      <rect x="105" y="195" width="14" height="28" rx="2" />
      <rect x="255" y="200" width="28" height="14" rx="2" />
